[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Two ~1.9MB app slots for over-the-air updates (Settings -> Firmware Update).
; The default table's 1.25MB slots are too tight for the embedded dashboard
; hero/favicon/icon images in src/assets.h (the hero alone is ~230KB);
; min_spiffs keeps the same NVS location as the old huge_app.csv table, so
; saved settings survive the switch. The first flash after changing
; partition tables must be over USB.
board_build.partitions = min_spiffs.csv
lib_deps =
    mathieucarbou/AsyncTCP @ ^3.2.15
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
    bblanchon/ArduinoJson @ ^7.3.1
