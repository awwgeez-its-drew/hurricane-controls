[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; This board is flashed over USB and never does an over-the-air update, so
; it doesn't need the default partition table's two ~1.25MB OTA app slots.
; huge_app.csv gives a single ~3MB app partition instead — comfortable
; headroom for the embedded dashboard hero/favicon/header-icon images in
; src/assets.h (the hero image alone is ~230KB).
board_build.partitions = huge_app.csv
lib_deps =
    mathieucarbou/AsyncTCP @ ^3.2.15
    mathieucarbou/ESPAsyncWebServer @ ^3.3.23
    bblanchon/ArduinoJson @ ^7.3.1
